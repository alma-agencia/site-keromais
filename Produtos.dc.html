<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,800;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  ::selection { background: #EBC58D; color: #4E352C; }
  .ph-stripe { background-image: repeating-linear-gradient(135deg, rgba(162,126,90,0.14) 0 14px, rgba(162,126,90,0.05) 14px 28px); }
</style>
</helmet>

<div style="font-family: 'Montserrat', sans-serif; color: #4E352C; background: #FAF6F0; overflow-x: hidden;">
  <dc-import name="SiteHeader" active="produtos" hint-size="100%,110px"></dc-import>

  <!-- HERO interno -->
  <section style="position: relative; background: #4E352C; color: #FAF6F0; overflow: hidden;">
    <div class="ph-stripe" style="position: absolute; inset: 0; opacity: 0.45;"></div>
    <div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 48px 40px 64px;">
      <div style="display: inline-flex; align-items: center; gap: 9px; margin-bottom: 18px;">
        <span style="width: 38px; height: 1px; background: #EBC58D;"></span>
        <span style="font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #EBC58D; font-weight: 600;">Catálogo Digital</span>
      </div>
      <h1 style="font-family: 'Playfair Display', serif; font-weight: 800; font-size: clamp(38px, 5vw, 62px); line-height: 1.06; margin: 0 0 18px;">Nossos Produtos</h1>
      <p style="font-size: 17px; line-height: 1.7; color: rgba(250,246,240,0.78); max-width: 540px; font-weight: 300; margin: 0;">Pães congelados artesanais organizados por linha. Frescor de forno, prontos para assar.</p>
    </div>
  </section>

  <!-- GRID -->
  <section style="background: #FAF6F0; padding: 80px 40px 100px;">
    <div style="max-width: 1280px; margin: 0 auto;">
      <sc-for list="{{ categories }}" as="cat" hint-placeholder-count="3">
        <div style="margin-bottom: 56px;">
          <div style="display: flex; align-items: baseline; gap: 16px; margin-bottom: 26px;">
            <h2 style="font-family: 'Playfair Display', serif; font-weight: 700; font-size: 28px; color: #4E352C; margin: 0;">{{ cat.title }}</h2>
            <span style="flex: 1; height: 1px; background: rgba(162,126,90,0.3);"></span>
            <span style="font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #A27E5A; font-weight: 600;">{{ cat.tag }}</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;">
            <sc-for list="{{ cat.products }}" as="p" hint-placeholder-count="3">
              <div style="background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid rgba(162,126,90,0.16); transition: all .25s ease;" style-hover="transform: translateY(-6px); box-shadow: 0 24px 44px -24px rgba(78,53,44,0.45); border-color: #EBC58D;">
                <div class="ph-stripe" style="aspect-ratio: 16/11; background: #efe4d4; display: flex; align-items: center; justify-content: center;">
                  <span style="font-family: monospace; font-size: 11px; color: #A27E5A;">[ {{ p.shot }} ]</span>
                </div>
                <div style="padding: 22px 22px 24px;">
                  <h3 style="font-family: 'Playfair Display', serif; font-weight: 700; font-size: 21px; color: #4E352C; margin: 0 0 7px; line-height: 1.2;">{{ p.name }}</h3>
                  <div style="font-size: 13px; color: #A27E5A; font-weight: 500; margin-bottom: 16px;">{{ p.variant }}</div>
                  <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(162,126,90,0.18); padding-top: 14px;">
                    <span style="font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #6b5547; font-weight: 600;">{{ p.weight }}</span>
                    <span style="font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #4E352C; font-weight: 700; background: #EBC58D; padding: 5px 11px; border-radius: 20px;">Congelado</span>
                  </div>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,340px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    return {
      categories: [
        { title: 'Pão Francês Tradicional', tag: 'Linha Clássica', products: [
          { name: 'Pão Francês', variant: 'Casca crocante · miolo macio', weight: '1 kg · 20 un', shot: 'pão francês' },
          { name: 'Pãozinho de Leite', variant: 'Levemente adocicado', weight: '600 g · 12 un', shot: 'pão de leite' },
          { name: 'Bisnaguinha', variant: 'Macia e fofinha', weight: '500 g · 16 un', shot: 'bisnaguinha' },
        ]},
        { title: 'Integrais & Grãos', tag: 'Linha Saudável', products: [
          { name: 'Pão Integral', variant: 'Farinha de trigo integral', weight: '800 g · 14 un', shot: 'pão integral' },
          { name: 'Multigrãos', variant: 'Linhaça · girassol · aveia', weight: '800 g · 14 un', shot: 'multigrãos' },
          { name: 'Pão de Centeio', variant: 'Sabor rústico marcante', weight: '700 g · 12 un', shot: 'centeio' },
        ]},
        { title: 'Pão de Mandioca', tag: 'Mandi Bread', products: [
          { name: 'Mandi Bread', variant: 'Goma de mandioca · sem glúten', weight: '500 g · 20 un', shot: 'pão de mandioca' },
          { name: 'Mandi Queijo', variant: 'Recheio de queijo', weight: '500 g · 18 un', shot: 'mandi queijo' },
          { name: 'Mandi Mini', variant: 'Porção individual', weight: '400 g · 24 un', shot: 'mandi mini' },
        ]},
      ],
    };
  }
}
</script>
</body>
</html>
