<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .kp-marquee-track { white-space: nowrap; }
</style>
</helmet>
<header ref="{{ headerRef }}" style="font-family: 'Montserrat', sans-serif; position: fixed; top: 0; left: 0; right: 0; width: 100%; z-index: 50; background: rgba(250,246,240,0.94); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(162,126,90,0.2); transition: transform 0.4s ease, opacity 0.35s ease;">
  <div class="kp-marquee-wrap" ref="{{ wrapRef }}" style="background: #4E352C; overflow: hidden; white-space: nowrap; transition: max-height 0.35s ease, opacity 0.3s ease;" onMouseEnter="{{ pause }}" onMouseLeave="{{ resume }}">
    <div class="kp-marquee-track" ref="{{ trackRef }}" style="display: inline-flex; align-items: center; will-change: transform;">
      <span style="display: inline-flex; align-items: center; color: #EBC58D; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; padding: 7px 0;">Pão Francês<span style="color: rgba(235,197,141,0.45); margin: 0 22px;">—</span></span>
      <span style="display: inline-flex; align-items: center; color: #EBC58D; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; padding: 7px 0;">Pãozinho de Leite<span style="color: rgba(235,197,141,0.45); margin: 0 22px;">—</span></span>
      <span style="display: inline-flex; align-items: center; color: #EBC58D; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; padding: 7px 0;">Bisnaguinha<span style="color: rgba(235,197,141,0.45); margin: 0 22px;">—</span></span>
      <span style="display: inline-flex; align-items: center; color: #EBC58D; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; padding: 7px 0;">Pão Integral<span style="color: rgba(235,197,141,0.45); margin: 0 22px;">—</span></span>
      <span style="display: inline-flex; align-items: center; color: #EBC58D; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; padding: 7px 0;">Multigrãos<span style="color: rgba(235,197,141,0.45); margin: 0 22px;">—</span></span>
      <span style="display: inline-flex; align-items: center; color: #EBC58D; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; padding: 7px 0;">Pão de Centeio<span style="color: rgba(235,197,141,0.45); margin: 0 22px;">—</span></span>
      <span style="display: inline-flex; align-items: center; color: #EBC58D; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; padding: 7px 0;">Mandi Bread<span style="color: rgba(235,197,141,0.45); margin: 0 22px;">—</span></span>
      <span style="display: inline-flex; align-items: center; color: #EBC58D; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; padding: 7px 0;">Mandi Queijo<span style="color: rgba(235,197,141,0.45); margin: 0 22px;">—</span></span>
      <span style="display: inline-flex; align-items: center; color: #EBC58D; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; padding: 7px 0;">Mandi Mini<span style="color: rgba(235,197,141,0.45); margin: 0 22px;">—</span></span>
      <span style="display: inline-flex; align-items: center; color: #EBC58D; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; padding: 7px 0;" aria-hidden="true">Pão Francês<span style="color: rgba(235,197,141,0.45); margin: 0 22px;">—</span></span>
      <span style="display: inline-flex; align-items: center; color: #EBC58D; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; padding: 7px 0;" aria-hidden="true">Pãozinho de Leite<span style="color: rgba(235,197,141,0.45); margin: 0 22px;">—</span></span>
      <span style="display: inline-flex; align-items: center; color: #EBC58D; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; padding: 7px 0;" aria-hidden="true">Bisnaguinha<span style="color: rgba(235,197,141,0.45); margin: 0 22px;">—</span></span>
      <span style="display: inline-flex; align-items: center; color: #EBC58D; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; padding: 7px 0;" aria-hidden="true">Pão Integral<span style="color: rgba(235,197,141,0.45); margin: 0 22px;">—</span></span>
      <span style="display: inline-flex; align-items: center; color: #EBC58D; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; padding: 7px 0;" aria-hidden="true">Multigrãos<span style="color: rgba(235,197,141,0.45); margin: 0 22px;">—</span></span>
      <span style="display: inline-flex; align-items: center; color: #EBC58D; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; padding: 7px 0;" aria-hidden="true">Pão de Centeio<span style="color: rgba(235,197,141,0.45); margin: 0 22px;">—</span></span>
      <span style="display: inline-flex; align-items: center; color: #EBC58D; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; padding: 7px 0;" aria-hidden="true">Mandi Bread<span style="color: rgba(235,197,141,0.45); margin: 0 22px;">—</span></span>
      <span style="display: inline-flex; align-items: center; color: #EBC58D; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; padding: 7px 0;" aria-hidden="true">Mandi Queijo<span style="color: rgba(235,197,141,0.45); margin: 0 22px;">—</span></span>
      <span style="display: inline-flex; align-items: center; color: #EBC58D; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; padding: 7px 0;" aria-hidden="true">Mandi Mini<span style="color: rgba(235,197,141,0.45); margin: 0 22px;">—</span></span>
    </div>
  </div>
  <div style="max-width: 1280px; margin: 0 auto; padding: 14px 40px; display: flex; align-items: center; justify-content: space-between; gap: 32px;">
    <a href="Kero Mais Paes.dc.html" style="display: flex; align-items: center; padding: 6px 14px; min-width: 152px; text-decoration: none;">
      <img src="assets/logo-kero.png" alt="Kero + Pães Congelados" style="height: 66px; width: auto; display: block;" />
    </a>
    <nav style="display: flex; align-items: center; gap: 4px; flex-wrap: wrap;">
      <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="4">
        <a href="{{ item.href }}" style="font-size: 12.5px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; text-decoration: none; padding: 10px 14px; border-radius: 4px; transition: all .2s ease; color: {{ item.color }}; border-bottom: 2px solid {{ item.underline }};" style-hover="color: #A27E5A; background: rgba(235,197,141,0.18);">{{ item.label }}</a>
      </sc-for>
      <a href="Area do Cliente.dc.html" style="font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; text-decoration: none; padding: 11px 20px; border-radius: 4px; margin-left: 8px; transition: all .2s ease; background: {{ clienteBg }}; color: {{ clienteColor }};" style-hover="background: #A27E5A; color: #FAF6F0;">Área do Cliente</a>
    </nav>
  </div>
</header>
<div ref="{{ spacerRef }}" style="height: 136px;"></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:110},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;quemsomos&quot;,&quot;produtos&quot;,&quot;trabalhe&quot;,&quot;sac&quot;,&quot;cliente&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.trackRef = React.createRef();
    this.wrapRef = React.createRef();
    this.spacerRef = React.createRef();
    this.headerRef = React.createRef();
    this.paused = false;
    this.x = 0;
  }
  componentDidMount() {
    const speed = 40;
    let last = null;
    const step = (t) => {
      if (last == null) last = t;
      const dt = (t - last) / 1000;
      last = t;
      const track = this.trackRef.current;
      if (track && !this.paused) {
        this.x -= speed * dt;
        const half = track.scrollWidth / 2;
        if (half > 0 && -this.x >= half) this.x += half;
        track.style.transform = 'translateX(' + this.x + 'px)';
      }
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);

    // Collapse the marquee strip once the second page block reaches it
    const wrap = this.wrapRef.current;
    this.mh = wrap ? wrap.offsetHeight : 36;
    const header = this.headerRef.current || document.querySelector('header');
    this.headerH = header ? header.offsetHeight : 136;
    if (header && this.spacerRef.current) {
      this.spacerRef.current.style.height = this.headerH + 'px';
    }
    this.onScroll = () => {
      const w = this.wrapRef.current;
      const h = this.headerRef.current;
      if (!w) return;
      const sections = document.querySelectorAll('section');
      const second = sections[1];
      let collapse;
      if (second) {
        collapse = second.getBoundingClientRect().top <= this.headerH;
      } else {
        collapse = window.scrollY > 240;
      }
      // Collapse the marquee strip
      w.style.maxHeight = collapse ? '0px' : (this.mh + 4) + 'px';
      w.style.opacity = collapse ? '0' : '1';
      // Hide the whole header (menu included) once block 2 reaches the top
      if (h) {
        h.style.transform = collapse ? 'translateY(-100%)' : 'translateY(0)';
        h.style.opacity = collapse ? '0' : '1';
        h.style.pointerEvents = collapse ? 'none' : 'auto';
      }
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
  }
  componentWillUnmount() {
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.onScroll) window.removeEventListener('scroll', this.onScroll);
  }
  renderVals() {
    const active = this.props.active || 'home';
    const items = [
      { label: 'Quem Somos', href: 'Quem Somos.dc.html', key: 'quemsomos' },
      { label: 'Produtos', href: 'Produtos.dc.html', key: 'produtos' },
      { label: 'Trabalhe Conosco', href: 'Trabalhe Conosco.dc.html', key: 'trabalhe' },
      { label: 'Comercial', href: 'SAC.dc.html', key: 'sac' },
    ].map(i => ({
      ...i,
      color: i.key === active ? '#A27E5A' : '#4E352C',
      underline: i.key === active ? '#EBC58D' : 'transparent',
    }));
    return {
      navItems: items,
      trackRef: this.trackRef,
      wrapRef: this.wrapRef,
      spacerRef: this.spacerRef,
      headerRef: this.headerRef,
      pause: () => { this.paused = true; },
      resume: () => { this.paused = false; },
      clienteBg: active === 'cliente' ? '#A27E5A' : '#EBC58D',
      clienteColor: active === 'cliente' ? '#FAF6F0' : '#4E352C',
    };
  }
}
</script>
</body>
</html>
