<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</helmet>
<footer style="font-family: 'Montserrat', sans-serif; background: #3b2820; color: rgba(250,246,240,0.7); padding: 64px 40px 36px;">
  <div style="max-width: 1280px; margin: 0 auto;">
    <div style="display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 40px; padding-bottom: 44px; border-bottom: 1px solid rgba(235,197,141,0.18);">
      <div>
        <img src="assets/logo-kero-light.png" alt="Kero + Pães Congelados" style="height: 84px; width: auto; display: block; margin-bottom: 18px;" />
        <p style="font-size: 13.5px; line-height: 1.7; max-width: 280px; margin: 0;">Fabricando qualidade em cada fornada. Pães congelados artesanais com a tradição que a sua mesa merece.</p>
      </div>
      <sc-for list="{{ footerCols }}" as="col" hint-placeholder-count="3">
        <div>
          <div style="font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #EBC58D; font-weight: 700; margin-bottom: 18px;">{{ col.title }}</div>
          <div style="display: flex; flex-direction: column; gap: 11px;">
            <sc-for list="{{ col.links }}" as="ln" hint-placeholder-count="4">
              <a href="{{ ln.href }}" style="font-size: 13.5px; color: rgba(250,246,240,0.7); text-decoration: none; transition: color .2s ease;" style-hover="color: #EBC58D;">{{ ln.label }}</a>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 26px; flex-wrap: wrap; gap: 12px;">
      <span style="font-size: 12px;">© 2026 Kero + Pães Congelados. Todos os direitos reservados.</span>
      <span style="font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #EBC58D; font-weight: 600;">Fabricando Qualidade</span>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:340}}">
class Component extends DCLogic {
  renderVals() {
    return {
      footerCols: [
        { title: 'Institucional', links: [
          { label: 'Quem Somos', href: 'Kero Mais Paes.dc.html' },
          { label: 'Trabalhe Conosco', href: 'Trabalhe Conosco.dc.html' },
          { label: 'Aviso de Privacidade', href: '#' },
          { label: 'Política de Qualidade', href: '#' },
        ]},
        { title: 'Produtos', links: [
          { label: 'Pão Francês', href: 'Produtos.dc.html' },
          { label: 'Integrais & Grãos', href: 'Produtos.dc.html' },
          { label: 'Pão de Mandioca', href: 'Produtos.dc.html' },
          { label: 'Catálogo Completo', href: 'Produtos.dc.html' },
        ]},
        { title: 'Atendimento', links: [
          { label: 'SAC', href: 'SAC.dc.html' },
          { label: 'Área do Cliente', href: 'Area do Cliente.dc.html' },
          { label: 'Portal TMS', href: 'Area do Cliente.dc.html' },
          { label: '0800 000 0000', href: '#' },
        ]},
      ],
    };
  }
}
</script>
</body>
</html>
