<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,800;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  ::selection { background: #EBC58D; color: #4E352C; }
  .ph-stripe { background-image: repeating-linear-gradient(135deg, rgba(162,126,90,0.14) 0 14px, rgba(162,126,90,0.05) 14px 28px); }
</style>
</helmet>

<div style="font-family: 'Montserrat', sans-serif; color: #4E352C; background: #FAF6F0; overflow-x: hidden;">
  <dc-import name="SiteHeader" active="cliente" hint-size="100%,110px"></dc-import>

  <section style="position: relative; background: #4E352C; color: #FAF6F0; overflow: hidden;">
    <div class="ph-stripe" style="position: absolute; inset: 0; opacity: 0.45;"></div>
    <div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 48px 40px 64px;">
      <div style="display: inline-flex; align-items: center; gap: 9px; margin-bottom: 18px;">
        <span style="width: 38px; height: 1px; background: #EBC58D;"></span>
        <span style="font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #EBC58D; font-weight: 600;">Portal do Parceiro · B2B</span>
      </div>
      <h1 style="font-family: 'Playfair Display', serif; font-weight: 800; font-size: clamp(38px, 5vw, 62px); line-height: 1.06; margin: 0 0 18px;">Área do Cliente</h1>
      <p style="font-size: 17px; line-height: 1.7; color: rgba(250,246,240,0.78); max-width: 540px; font-weight: 300; margin: 0;">Utilitários comerciais e logísticos para o nosso parceiro de negócios.</p>
    </div>
  </section>

  <section style="background: #FAF6F0; padding: 80px 40px 100px;">
    <div style="max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; align-items: stretch;">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <sc-for list="{{ b2bLinks }}" as="l" hint-placeholder-count="2">
          <a href="#" style="background: #fff; border: 1px solid rgba(162,126,90,0.2); border-radius: 10px; padding: 30px 28px; text-decoration: none; color: #4E352C; display: flex; flex-direction: column; justify-content: space-between; min-height: 200px; transition: all .25s ease;" style-hover="border-color: #EBC58D; box-shadow: 0 24px 44px -26px rgba(78,53,44,0.45); transform: translateY(-4px);">
            <div style="width: 48px; height: 48px; border-radius: 10px; background: #EBC58D; color: #4E352C; display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-weight: 800; font-size: 22px;">{{ l.icon }}</div>
            <div>
              <h3 style="font-family: 'Playfair Display', serif; font-weight: 700; font-size: 22px; margin: 0 0 8px; color: #4E352C;">{{ l.title }}</h3>
              <p style="font-size: 14px; line-height: 1.6; color: #6b5547; margin: 0;">{{ l.desc }}</p>
              <span style="display: inline-block; margin-top: 16px; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #A27E5A; font-weight: 700;">Acessar →</span>
            </div>
          </a>
        </sc-for>
      </div>

      <div style="background: #4E352C; color: #FAF6F0; border-radius: 12px; padding: 40px 36px; box-shadow: 0 30px 60px -34px rgba(0,0,0,0.5); position: relative; overflow: hidden;">
        <div class="ph-stripe" style="position: absolute; inset: 0; opacity: 0.25;"></div>
        <div style="position: relative;">
          <div style="font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; color: #EBC58D; font-weight: 700; margin-bottom: 6px;">Portal TMS</div>
          <h3 style="font-family: 'Playfair Display', serif; font-weight: 700; font-size: 28px; margin: 0 0 4px;">Logística</h3>
          <p style="font-size: 13px; color: rgba(250,246,240,0.65); margin: 0 0 28px;">Acesso seguro para parceiros de transporte.</p>
          <label style="display: block; margin-bottom: 16px;">
            <span style="display: block; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #EBC58D; font-weight: 600; margin-bottom: 8px;">Login</span>
            <input type="text" placeholder="seu.login" style="width: 100%; border: 1px solid rgba(235,197,141,0.3); background: rgba(250,246,240,0.08); border-radius: 6px; padding: 13px 14px; font-family: 'Montserrat', sans-serif; font-size: 14px; color: #FAF6F0; outline: none;" style-focus="border-color: #EBC58D;" />
          </label>
          <label style="display: block; margin-bottom: 26px;">
            <span style="display: block; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #EBC58D; font-weight: 600; margin-bottom: 8px;">Senha</span>
            <input type="password" placeholder="••••••••" style="width: 100%; border: 1px solid rgba(235,197,141,0.3); background: rgba(250,246,240,0.08); border-radius: 6px; padding: 13px 14px; font-family: 'Montserrat', sans-serif; font-size: 14px; color: #FAF6F0; outline: none;" style-focus="border-color: #EBC58D;" />
          </label>
          <button style="width: 100%; background: #EBC58D; color: #4E352C; border: none; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; padding: 16px; border-radius: 6px; cursor: pointer; transition: all .25s ease;" style-hover="background: #A27E5A; color: #FAF6F0;">Acessar</button>
          <a href="#" style="display: block; text-align: center; margin-top: 16px; font-size: 12px; color: rgba(250,246,240,0.6); text-decoration: none; font-weight: 500;">Esqueci minha senha</a>
        </div>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,340px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    return {
      b2bLinks: [
        { icon: '⁝', title: 'Emissão de XML', desc: 'Baixe o XML das suas Notas Fiscais eletrônicas.' },
        { icon: '$', title: '2ª Via de Boletos', desc: 'Consulte e emita a segunda via de boletos bancários.' },
      ],
    };
  }
}
</script>
</body>
</html>
